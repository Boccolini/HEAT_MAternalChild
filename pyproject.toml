[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heat-maternal-child"
version = "0.1.0"
description = "Reproducible scaffold for the Brazilian heat and MNCH pipeline."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "datasus-dbc==0.1.3",
  "dbfread>=2.0.7,<3",
  "duckdb>=1.4,<2",
  "fastapi>=0.116,<1",
  "matplotlib>=3.9,<4",
  "openpyxl>=3.1.5,<4",
  "orjson>=3.11,<4",
  "pandas>=3.0.1,<4",
  "pydantic>=2.11,<3",
  "pyarrow>=23.0.1,<24",
  "python-docx>=1.1.2,<2",
  "requests>=2.32,<3",
  "statsmodels>=0.14,<1",
  "uvicorn>=0.35,<1",
  "xlrd>=2.0.2,<3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.0",
]

[project.scripts]
heat-mnch = "heat_mnch.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
